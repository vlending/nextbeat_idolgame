<style>
/* Layout: 한 손 세로 화면. 상단 '무대 조명' 네이비 밴드 + 2×2 멤버 카드 + 하단 고정 액션 바. 게임 화면이므로 단일 라이트 테마로 고정. */
:root{
  --bg:#EEF0FA; --card:#FFFFFF; --ink:#1F2140; --sub:#686C90; --line:#DCDFF1;
  --accent:#FF4F8B; --accent-ink:#FFFFFF; --stage:#1F2140; --stage-ink:#F4F2FF;
  --vocal:#7C6CF2; --dance:#FF8A3D; --charm:#FF4F8B; --cond:#25B99A; --gold:#FFB938; --warn:#E5484D;
  --skin:#FFE3D3; --blush:#FFB3C1;
  --f-display:"Jua","Gothic A1",system-ui,sans-serif;
  --f-body:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--vocal);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}

/* 상단 무대 밴드 */
.top{background:var(--stage);color:var(--stage-ink);padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-radius:0 0 22px 22px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:-40% 30% auto -10%;height:180%;background:radial-gradient(closest-side,rgba(255,79,139,.28),transparent);pointer-events:none}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.group{font-family:var(--f-display);font-size:26px;letter-spacing:.02em;line-height:1.1}
.status{font-size:12px;opacity:.75;margin-top:4px}
.period{text-align:right;font-family:var(--f-display);font-size:18px}
.period small{display:block;font-family:var(--f-body);font-size:11px;opacity:.7}
.music{margin-top:8px;font-family:var(--f-body);font-size:11.5px;font-weight:600;color:var(--stage-ink);background:rgba(255,255,255,.12);border-radius:999px;padding:5px 10px}
.music[aria-pressed="false"]{opacity:.55}
.wallet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.wallet div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.wallet span{display:block;font-size:11px;opacity:.7}
.wallet b{font-size:16px}
.goal{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
.goal .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink);font-weight:600}

/* 멤버 카드 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--card);border-radius:18px;padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(31,33,64,.06);min-width:0}
.card .tired{position:absolute;top:6px;left:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.card:active{transform:scale(.98)}
.card .av{position:relative;background:var(--tint);border-radius:12px;aspect-ratio:1/0.9;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;max-width:100%}
.card .av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.name{font-family:var(--f-display);font-size:18px;line-height:1}
.role{font-size:11px;color:var(--sub)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:28px 1fr 22px;align-items:center;gap:4px;font-size:10.5px;color:var(--sub)}
.bar i{height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;border-radius:3px;transition:width .5s}
.bar em{font-style:normal;text-align:right;color:var(--ink);font-weight:600}
.chip{font-size:11.5px;font-weight:600;border-radius:8px;padding:5px 8px;background:var(--bg);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.set{background:var(--ink);color:var(--stage-ink)}

/* 하단 바 */
.dock{position:fixed;left:0;right:0;bottom:0;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.dock-in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border-radius:16px;padding:15px 12px;font-family:var(--f-display);font-size:17px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 #C93268}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C93268}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}
.btn.alt:active{box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 #D18E12}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{display:block;font-family:var(--f-body);font-size:11px;opacity:.8;margin-top:2px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(20,21,45,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;text-wrap:balance}
.sheet h3{font-size:12px;letter-spacing:.06em;color:var(--sub);margin:18px 0 8px;font-weight:800}
.sheet p{line-height:1.6;margin:0}
.x{float:right;font-size:22px;line-height:1;padding:4px 8px;color:var(--sub)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero{position:relative;margin:-18px calc(-1 * max(18px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));aspect-ratio:1/0.82;max-width:none;overflow:hidden;border-radius:24px 24px 0 0;background:var(--tint)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.hero .x{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.85);border-radius:999px;width:36px;height:36px;padding:0;color:var(--ink)}
.hero-cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(transparent,rgba(20,21,45,.78));color:#fff;font-size:12.5px}
.hero-cap h2{color:#fff;margin:0}.hero-cap h2 span{font-family:var(--f-body);font-size:13px;opacity:.8}
.motto{font-family:var(--f-display);font-size:17px;margin:14px 0 0!important;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
.facts div{background:var(--bg);border-radius:10px;padding:7px 8px;min-width:0}
.facts dt{font-size:10.5px;color:var(--sub)}.facts dd{margin:2px 0 0;font-size:12px;font-weight:800;overflow-wrap:anywhere}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:11.5px;color:var(--sub)}
.swatches span{display:flex;align-items:center;gap:5px}.swatches i{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mbars{margin-top:14px;gap:6px}.mbars .bar{grid-template-columns:40px 1fr 26px;font-size:12px}
.trait{font-size:12px;color:var(--sub);margin-top:8px!important}
.bubble{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.bubble .face img{width:52px;height:52px;border-radius:12px;object-fit:cover;display:block}
.ev-face{float:right;margin-left:10px}.ev-face img{width:56px;height:56px;border-radius:12px;object-fit:cover;display:block}
.photo{width:100%;border-radius:16px;margin-top:14px;display:block}
.keyart{position:relative;margin-inline:-4px}.keyart img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;box-shadow:0 18px 40px rgba(0,0,0,.35)}
@media (max-width:360px){.facts{grid-template-columns:repeat(2,1fr)}}
.profile{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.profile .av{border-radius:16px;background:linear-gradient(var(--tint),var(--bg));display:flex;justify-content:center;align-items:flex-end;aspect-ratio:1;overflow:hidden}
.profile .av img{width:100%;height:100%;object-fit:cover;display:block}
.profile .bars{gap:6px}
.profile .bar{grid-template-columns:34px 1fr 26px;font-size:12px}
.hearts{color:var(--accent);font-size:13px;letter-spacing:2px}
.bubble{background:var(--bg);border-radius:4px 16px 16px 16px;padding:12px 14px;margin-top:12px;line-height:1.6;position:relative}
.bubble .who{font-weight:800;font-size:12px;color:var(--sub);display:block;margin-bottom:2px}
.talk{margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);padding:6px 0}
.talk[disabled]{color:var(--sub);pointer-events:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.opt b{font-size:14px}
.opt span{font-size:11.5px;color:var(--sub);line-height:1.4}
.opt.on{border-color:var(--ink);background:var(--bg)}
.opt.bad{opacity:.45;pointer-events:none}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;color:#fff;margin-right:4px}

.res{display:grid;gap:8px;margin-top:10px}
.res-row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px}
.res-row img{width:44px;height:44px;border-radius:10px;object-fit:cover;display:block}
.res-row b{font-size:13px}
.res-row div > span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.up{color:var(--cond);font-weight:800}.down{color:var(--warn);font-weight:800}
.event{border:2px dashed var(--line);border-radius:16px;padding:14px;margin-top:14px}
.event .opts{margin-top:10px}
.concepts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.concept{border-radius:16px;padding:14px 12px;text-align:left;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.concept b{font-family:var(--f-display);font-weight:400;font-size:19px}
.concept span{font-size:11.5px;opacity:.9;line-height:1.4}
.rank{font-family:var(--f-display);font-size:72px;line-height:1;text-align:center;margin:12px 0 0}
.rank small{font-size:22px}
.center{text-align:center}
.row-btns{display:flex;gap:10px;margin-top:18px}

/* 타이틀 */
.title{flex:1;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:20px 32px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--stage);color:var(--stage-ink);position:relative;overflow:hidden}
.title::before{content:"";position:absolute;left:50%;top:-30%;width:140%;height:170%;transform:translateX(-50%);background:conic-gradient(from 160deg at 50% 0%,transparent 0 10deg,rgba(255,255,255,.07) 10deg 22deg,transparent 22deg 34deg,rgba(255,79,139,.12) 34deg 44deg,transparent 44deg);pointer-events:none}
.title h1{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.05;margin:0;position:relative}
.title h1 em{font-style:normal;color:var(--accent)}
.title p{opacity:.8;line-height:1.6;margin:0;position:relative}
.lineup{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.lineup div{text-align:center;font-size:12px}
.lineup img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px}
.title .btns{display:grid;gap:12px;position:relative}

.title label{font-size:12px;opacity:.7;display:block;margin-bottom:6px}
.keyart#card img{aspect-ratio:auto}
.hint{font-size:12.5px;text-align:center;margin-top:-8px!important}
.share{display:grid;gap:10px;position:relative}
.share h3{font-size:12px;letter-spacing:.06em;margin:4px 0 0;opacity:.75}
.sns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sns a,.sns button{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:rgba(255,255,255,.12);color:var(--stage-ink);font-weight:800;font-size:12.5px;text-decoration:none;text-align:center;padding:4px}
.sns a:focus-visible{outline:3px solid var(--gold)}
#stext{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--stage-ink);font:inherit;font-size:12.5px;padding:10px;resize:none}
.res-row.rec{width:100%;text-align:left}
.tools{display:flex;gap:8px;margin:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

.chart{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.chart li{display:grid;grid-template-columns:36px 10px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px}
.chart li.ours{background:var(--ink);color:var(--stage-ink)}
.chart .rk{font-weight:800;text-align:right}.chart i{width:10px;height:10px;border-radius:3px}
.chart .tg{font-size:11px;font-weight:800;color:var(--accent)}
.rival{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px}

.breakdown{display:grid;gap:4px;margin-top:12px;background:var(--bg);border-radius:14px;padding:10px 14px}

.rhythm{position:fixed;inset:0;z-index:30;background:linear-gradient(#14152D,#2A1F4A);color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:none;user-select:none;-webkit-user-select:none}
.rh-top{display:flex;justify-content:space-between;align-items:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rh-top b{font-family:var(--f-display);font-weight:400;font-size:20px;margin-right:10px}.rh-top span{font-size:13px;opacity:.8}

</style>

function rivalRanks(month, ours){
  const used = new Set(ours ? [ours] : []);
  return RIVALS.map((r,i)=>{
    let k = Math.round(r.from + (r.to-r.from)*(month-1)/(LAST_MONTH-1)) + (((month*7 + i*13) % 5) - 2);
    k = Math.max(1, Math.min(100, k));
    while (used.has(k)) k++;
    used.add(k);
    return { ...r, rank:k };
  });
}

/* ───── 무대 조건 ───── */
function stageInfo(s){
  if (!s.debuted){
    const need = 30, now = avgStat(s);
    if (s.month < 3) return { ok:false, text:`데뷔 쇼케이스는 3월부터 · 평균 능력치 ${now}/${need}` };
    if (now < need) return { ok:false, text:`데뷔 조건: 평균 능력치 ${now}/${need}` };
    return { ok:true, text:'데뷔 쇼케이스 준비 완료!' };
  }
  const wait = 3 - (s.month - s.lastStage);
  if (wait > 0) return { ok:false, text:`다음 컴백까지 ${wait}개월` };
  return { ok:true, text:'컴백 무대를 열 수 있어요!' };
}

    <button class="tool" id="chart">라이벌 차트${nextRival(s)?` <em>목표 ${nextRival(s).name}</em>`:' <em>전원 격파</em>'}</button>

}
const schedName = k => (k==='work' && S.debuted) ? SCHED.work.name2 : SCHED[k].name;
const schedDesc = k => (k==='work' && S.debuted) ? SCHED.work.desc2 : SCHED[k].desc;

/* ───── 멤버 시트 ───── */
function openMember(id){
  const m = mem(S,id), d = BY_ID[id];
  const hearts = '♥'.repeat(Math.round(m.bond/20)) + '♡'.repeat(5-Math.round(m.bond/20));

    <h3>이번 달 일정</h3>
    <div class="opts">${Object.keys(SCHED).map(k=>{
      const c=SCHED[k]; const poor = c.cost>0 && S.money - plannedCost(id) < c.cost;
      return `<button class="opt ${m.sched===k?'on':''} ${poor?'bad':''}" data-s="${k}"><b>${schedName(k)}</b><span>${poor?'자금이 부족해요':schedDesc(k)}</span></button>`; }).join('')}

function plannedCost(exceptId){ return S.members.reduce((t,m)=> t + (m.id!==exceptId && m.sched ? SCHED[m.sched].cost : 0), 0); }

/* ───── 한 달 진행 ───── */
function runMonth(){
  const s = S;
  const cost = s.members.reduce((t,m)=>t+(m.sched?SCHED[m.sched].cost:0),0);
  if (cost > s.money){ toast('레슨비가 부족해요. 아르바이트나 휴식으로 바꿔주세요.'); return; }
  const rows = [];
  s.money -= cost;
  for (const m of s.members){
    const d = BY_ID[m.id], k = m.sched || 'rest', sc = SCHED[k];
    const parts = [];
    if (sc.stat){
      const tired = m.cond < 30;
      let g = rnd(5,8) * (d.boost[sc.stat]||1) * (1 + m.bond/200);
      if (tired) g *= 0.4;
      if (s.fac[FAC_STAT[sc.stat]]) g += 2;
      const before = m[sc.stat]; m[sc.stat] = clamp(m[sc.stat]+g); const gain = m[sc.stat]-before;
      parts.push(`${STAT_LABEL[sc.stat]} <span class="up">+${gain}</span>`);
      if (!tired && Math.random()<0.35){
        const other = pick(['vocal','dance','charm'].filter(x=>x!==sc.stat));
        if (m[other]<100){ m[other]=clamp(m[other]+1); parts.push(`${STAT_LABEL[other]} <span class="up">+1</span>`); }
      }
      if (tired) parts.push('<span class="down">컨디션 난조로 효과 감소</span>');
    } else if (k==='work'){
      if (s.debuted){
        const inc = 40 + Math.min(160, Math.round(s.fans/400)); s.money += inc;
        const f = addFans(s, 30 + m.charm*2); parts.push(`수입 <span class="up">+${inc}만원</span> · 팬 <span class="up">+${fmt(f)}</span>`);
      } else { s.money += 35; parts.push('수입 <span class="up">+35만원</span>'); }
    } else if (k==='sns'){
      const f = addFans(s, ((20 + m.charm*3 + m.bond) * (s.debuted ? 4 : 1) + s.fans*0.01) * (s.fac.pr ? 1.5 : 1));
      parts.push(`팬 <span class="up">+${fmt(f)}</span>`);
    }
    const bc = m.cond; m.cond = clamp(m.cond + sc.cond + (k==='rest' && s.fac.lounge ? 15 : 0)); const dc = m.cond-bc;
    parts.push(`컨디션 <span class="${dc>=0?'up':'down'}">${dc>=0?'+':''}${dc}</span>`);
    rows.push({ id:m.id, title:`${d.name} · ${schedName(k)}`, text:parts.join(' · ') });
  }
  s.money -= LIVING_COST;
  // 데뷔 후에는 팬들이 조금씩 자연 증가 + 음원 수익
  let passive = '';
  if (s.debuted){
    const f = addFans(s, s.fans*0.02*(s.fac.pr ? 1.5 : 1)); const inc = Math.round(s.fans/1000)*3; s.money += inc;
    passive = `음원·굿즈 수익 +${inc}만원 · 자연 유입 팬 +${fmt(f)}`;
  }
  const evPool = EVENTS.filter(e=>e.when(s));
  const ev = Math.random()<0.6 ? pick(evPool) : null;
  s.members.forEach(m=>{ m.chatted=false; m.line=null; });
  save();
  showResult(rows, passive, ev);
}

function showResult(rows, passive, ev){
  const evWho = ev ? (EV_WHO[ev.id] || pick(MEMBERS).id) : null;
  openSheet(`
    <h2>${periodText(S.month)} 결과</h2>
    <p style="color:var(--sub);font-size:13px">숙소·운영비 -${LIVING_COST}만원${passive?' · '+passive:''}</p>
    <div class="res">${rows.map(r=>`<div class="res-row">${avatar(r.id, moodOf(mem(S,r.id)))}<div><b>${r.title}</b><span>${r.text}</span></div></div>`).join('')}</div>
    ${ev ? `<div class="event" id="ev"><div class="ev-face">${avatar(evWho, 'surprised')}</div><h3 style="margin-top:0">이번 달 사건</h3><b>${ev.title}</b><p style="font-size:13px;color:var(--sub)">${ev.text}</p>
      <div class="opts"><button class="opt" data-c="a"><b>${ev.a.label}</b></button><button class="opt" data-c="b"><b>${ev.b.label}</b></button></div></div>` : ''}
    <div class="row-btns"><button class="btn" id="go" ${ev?'disabled':''}>다음 달로</button></div>`, true);
  if (ev) document.querySelectorAll('#ev .opt').forEach(b=>b.onclick=()=>{
    const msg = ev[b.dataset.c].run(S); save();
    $('#ev').innerHTML = `<h3 style="margin-top:0">이번 달 사건</h3><b>${ev.title}</b><p style="margin-top:6px">${ev[b.dataset.c].label} → <b>${msg}</b></p>`;
    $('#go').disabled = false;
  });
  $('#go').onclick = () => {
    closeSheet();
    if (S.month >= LAST_MONTH){ S.ended = true; save(); showEnding(saveRecord(S)); return; }
    S.month++; save(); renderMain();
    if (S.money < 0) toast('자금이 마이너스예요! 아르바이트·행사로 수입을 늘려주세요.');
  };
}

/* ───── 리듬게임 ───── */
const BPM = 115, BEAT = 60/BPM, BEAT0 = 0.305; // 배경음악 박자 (분석값)
const LANE_COLOR = { dorin:'#0E6673', garam:'#D9922E', seon:'#C0606F', rie:'#7B5CFF' };
function startRhythm(c, onDone){
  const s = S, level = s.stages.length;              // 컴백할수록 노트가 많아짐
  const segBeat = pick([16, 48, 96, 144, 192]);
  const segStart = BEAT0 + segBeat*BEAT, startT = segStart - 4*BEAT;
  const notes = []; let prev = -1;
  for (let b=0; b<32; b++){
    let lane = rnd(0,3); if (lane===prev) lane = (lane+rnd(1,3))%4; prev = lane;
    notes.push({ t:segStart+b*BEAT, lane });
    if (b>=8 && b%8===0 && Math.random()<0.5+level*0.08) notes.push({ t:segStart+b*BEAT, lane:(lane+2)%4 });
    if (b<31 && Math.random() < Math.min(0.45, 0.15+level*0.07)) notes.push({ t:segStart+(b+0.5)*BEAT, lane:(lane+rnd(1,3))%4 });
  }
  notes.forEach(n=>n.res=null);
  const ov = document.createElement('div'); ov.className = 'rhythm';
  ov.innerHTML = `<div class="rh-top"><div><b>${c.name} 무대</b><span id="rhAcc">정확도 -</span></div><button id="rhSkip">건너뛰기</button></div>
    <canvas id="rhc" aria-label="리듬게임: 노트가 선에 닿을 때 해당 멤버 칸을 터치하세요"></canvas>
    <div class="rh-lanes">${s.members.map((m,i)=>`<button data-l="${i}" style="--lc:${LANE_COLOR[m.id]}">${avatar(m.id,'normal')}<span>${BY_ID[m.id].name}</span></button>`).join('')}</div>`;
  document.body.appendChild(ov);
  const cv = $('#rhc'), g = cv.getContext('2d');
  const fit = () => { const r = cv.getBoundingClientRect(), d = devicePixelRatio||1; cv.width = r.width*d; cv.height = r.height*d; g.setTransform(d,0,0,d,0,0); };
  fit(); addEventListener('resize', fit);
  const APPROACH = 1.4, PERFECT = 0.075, GOOD = 0.15;
  let t0 = performance.now(), done = false, combo = 0, maxCombo = 0, flashes = [];
  const useAudio = musicOn;
  if (useAudio){ try{ bgm.currentTime = startT; }catch(e){} bgm.play().catch(()=>{}); }
  const clock = () => (useAudio && !bgm.paused) ? bgm.currentTime : startT + (performance.now()-t0)/1000;
  ov.__rh = { notes, clock };
  const judge = (lane) => {
    const t = clock(); let best = null;
    for (const n of notes) if (!n.res && n.lane===lane && Math.abs(n.t-t)<=GOOD && (!best || Math.abs(n.t-t)<Math.abs(best.t-t))) best = n;
    const lb = ov.querySelector(`[data-l="${lane}"]`); lb.classList.remove('hit'); void lb.offsetWidth; lb.classList.add('hit');
    if (!best) return;
    best.res = Math.abs(best.t-t) <= PERFECT ? 'perfect' : 'good';
    combo++; maxCombo = Math.max(maxCombo, combo);
    flashes.push({ lane, text: best.res==='perfect'?'PERFECT':'GOOD', at:performance.now() });
  };
  ov.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('pointerdown', e=>{ e.preventDefault(); judge(+b.dataset.l); }));
  cv.addEventListener('pointerdown', e=>{ const r=cv.getBoundingClientRect(); judge(Math.min(3, Math.floor((e.clientX-r.left)/(r.width/4)))); });
  const keys = { d:0, f:1, j:2, k:3 };
  const onKey = e => { if (keys[e.key]!==undefined) judge(keys[e.key]); };
  addEventListener('keydown', onKey);
  const finish = (skipped) => {
    if (done) return; done = true; removeEventListener('keydown', onKey); removeEventListener('resize', fit);
    const per = notes.filter(n=>n.res==='perfect').length, good = notes.filter(n=>n.res==='good').length, miss = notes.length-per-good;
    const acc = skipped ? 0.55 : (per + good*0.6)/notes.length;
    const lanePer = [0,1,2,3].map(l=>notes.filter(n=>n.lane===l && n.res==='perfect').length);
    const stats = { per, good, miss, maxCombo, acc, skipped, lanePer, total:notes.length };
    if (skipped){ ov.remove(); onDone(acc, stats); return; }
    const grade = acc>=0.9?'S':acc>=0.75?'A':acc>=0.55?'B':acc>=0.35?'C':'D';
    ov.insertAdjacentHTML('beforeend', `<div class="rh-end"><p>무대 평가</p><strong>${grade}</strong><p class="num">정확도 ${Math.round(acc*100)}% · 최대 콤보 ${maxCombo}</p><p class="num">PERFECT ${per} · GOOD ${good} · MISS ${miss}</p><button class="btn" id="rhOk">결과 발표</button></div>`);
    $('#rhOk').onclick = () => { ov.remove(); onDone(acc, stats); };
  };
  $('#rhSkip').onclick = () => finish(true);
  const draw = () => {
    if (done) return;
    const t = clock(), W = cv.clientWidth, H = cv.clientHeight, hitY = H - 24, lw = W/4;
    g.clearRect(0,0,W,H);
    for (let l=0; l<4; l++){ g.fillStyle = l%2 ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.07)'; g.fillRect(l*lw,0,lw,H); }
    // 박자선
    for (let b=Math.ceil((t-segStart)/BEAT); b<Math.ceil((t+APPROACH-segStart)/BEAT); b++){ const y = hitY - ((segStart+b*BEAT)-t)/APPROACH*hitY; g.fillStyle='rgba(255,255,255,.08)'; g.fillRect(0,y,W,1); }
    g.fillStyle = '#FF4F8B'; g.fillRect(0,hitY-2,W,4);
    let combo0 = combo;
    for (const n of notes){
      if (!n.res && t - n.t > GOOD){ n.res = 'miss'; combo = 0; flashes.push({ lane:n.lane, text:'MISS', at:performance.now() }); }
      if (n.res) continue;
      const dt = n.t - t; if (dt > APPROACH) continue;
      const y = hitY - dt/APPROACH*hitY, x = n.lane*lw + lw/2;
      g.fillStyle = LANE_COLOR[s.members[n.lane].id]; roundRect(g, x-lw*0.36, y-11, lw*0.72, 22, 11); g.fill();
      g.fillStyle = 'rgba(255,255,255,.85)'; roundRect(g, x-lw*0.36+4, y-7, lw*0.72-8, 5, 3); g.fill();
    }
    const now = performance.now(); flashes = flashes.filter(f=>now-f.at<500);
    g.textAlign='center'; g.font='20px "Jua",sans-serif';
    for (const f of flashes){ g.globalAlpha = 1-(now-f.at)/500; g.fillStyle = f.text==='MISS'?'#FF8FA3':f.text==='PERFECT'?'#FFE07A':'#FFFFFF'; g.fillText(f.text, f.lane*lw+lw/2, hitY-40-(now-f.at)/20); }
    g.globalAlpha = 1;
    if (t < segStart){ const left = Math.ceil((segStart-t)/BEAT); g.fillStyle='#fff'; g.font='64px "Jua",sans-serif'; g.fillText(left>3?'준비':String(left), W/2, H*0.42); }
    if (combo>=3){ g.fillStyle='rgba(255,255,255,.9)'; g.font='28px "Jua",sans-serif'; g.fillText(`${combo} COMBO`, W/2, H*0.3); }
    const judged = notes.filter(n=>n.res); if (judged.length){ const a=(judged.filter(n=>n.res==='perfect').length + judged.filter(n=>n.res==='good').length*0.6)/judged.length; $('#rhAcc').textContent = `정확도 ${Math.round(a*100)}%`; }
    if (t > notes[notes.length-1].t + 0.8) return finish(false);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
}

/* ───── 무대 (데뷔 / 컴백) ───── */
function openStage(){
  const s = S;
  openSheet(`<button class="x" data-close aria-label="닫기">×</button>
    <h2>${s.debuted ? `${s.stages.length}번째 컴백` : '데뷔 쇼케이스'}</h2>
    <p style="color:var(--sub);font-size:13px">컨셉을 고르면 무대(리듬게임)가 시작돼요. 노트가 분홍 선에 닿을 때 그 멤버 칸을 터치하세요.${Object.keys(s.prep).length?` 준비한 투자로 점수 +${prepBonus(s)}.`:' 투자 메뉴에서 뮤비·의상·곡을 준비하면 점수가 올라요.'}${s.lastConcept?` 지난번(${CONCEPTS.find(c=>c.id===s.lastConcept).name})과 같은 컨셉은 신선도가 떨어져요.`:''}</p>
    <h3>컨셉</h3>
    <div class="concepts">${CONCEPTS.map(c=>`<button class="concept" data-c="${c.id}" style="background:${c.color}"><b>${c.name}</b><span>${c.desc}<br>예상 적합도 ${fitPct(c)}%</span></button>`).join('')}</div>`);
  document.querySelectorAll('.concept').forEach(b=>b.onclick=()=>{ const c=CONCEPTS.find(x=>x.id===b.dataset.c); closeSheet(); startRhythm(c, (acc,st)=>perform(c.id, acc, st)); });
}
function fitPct(c){
  const best = S.members.reduce((t,m)=>t+Math.max(m.vocal,m.dance,m.charm),0);
  const val = S.members.reduce((t,m)=>t+m.vocal*c.w.vocal+m.dance*c.w.dance+m.charm*c.w.charm,0);
  return Math.round(val/best*100);
}
function perform(cid, acc, rs){
  const s = S, c = CONCEPTS.find(x=>x.id===cid);
  let perf = 0;
  for (const m of s.members){
    const v = m.vocal*c.w.vocal + m.dance*c.w.dance + m.charm*c.w.charm;
    perf += v * 3 * (0.6 + 0.4*m.cond/100);
  }
  perf = Math.round(perf);
  const buzz = Math.round(Math.log10(s.fans + 10) * 22);
  const rhythm = Math.round((acc - 0.55) * 150);
  const prep = prepBonus(s) + s.songBonus;
  const luck = rnd(-8,8);
  let score = perf + buzz + rhythm + prep + luck;
  const stale = s.lastConcept === cid;
  if (stale) score *= 0.9;
  score = Math.round(score);
  let rank = Math.round(100 - (score - 300) * 99 / 400);
  rank = Math.max(1, Math.min(100, rank));
  let fansGain = Math.round((101-rank)**2 * 6 + 300);
  const income = Math.round(100 + (101-rank) * 5);
  const wasDebut = !s.debuted;
  s.debuted = true; s.lastStage = s.month; s.lastConcept = cid; s.songBonus = 0; s.prep = {};
  s.stages.push({ month:s.month, concept:cid, rank, acc:Math.round(acc*100) });
  s.bestRank = s.bestRank ? Math.min(s.bestRank, rank) : rank;
  // 라이벌
  const rv = rivalRanks(s.month, rank), newly = [];
  for (const r of rv) if (!s.beaten.includes(r.id) && rank < r.rank){ s.beaten.push(r.id); newly.push(r); fansGain += r.reward; }
  addFans(s, fansGain); s.money += income;
  allCond(s, -10);
  const firstWin = rank===1 && !s.firstWin; if (rank===1) s.firstWin = true;
  save();
  // MVP: 리듬게임 PERFECT가 가장 많은 멤버 (건너뛰면 능력치 기준)
  const fit = m => m.vocal*c.w.vocal+m.dance*c.w.dance+m.charm*c.w.charm;
  const lead = (!rs.skipped && Math.max(...rs.lanePer) > 0)
    ? s.members[rs.lanePer.indexOf(Math.max(...rs.lanePer))]
    : s.members.slice().sort((a,b)=>fit(b)-fit(a))[0];
  const chart = [...rv.map(r=>({name:r.name, rank:r.rank, color:r.color, tag: newly.includes(r)?'격파!':s.beaten.includes(r.id)?'격파':''})),
    {name:s.group, rank, color:'var(--accent)', ours:true, tag:'우리'}].sort((a,b)=>a.rank-b.rank);
  const row = (k,v,note) => `<div><span>${k}${note?` <small>${note}</small>`:''}</span><b class="num ${v<0?'down':''}">${v>=0?'+':''}${v}</b></div>`;
  openSheet(`
    <h2 class="center">${wasDebut?'데뷔 쇼케이스':'컴백 무대'} · ${c.name}</h2>
    <div class="rank num" id="rk">100<small>위</small></div>
    <p class="center" style="color:var(--sub)">음원차트 순위 · 무대 점수 ${score}점</p>
    <div class="breakdown">
      ${row('멤버 능력치', perf)}${row('팬 화제성', buzz)}
      ${row('무대 퍼포먼스', rhythm, rs.skipped?'건너뜀':`정확도 ${Math.round(acc*100)}%`)}
      ${prep?row('투자·준비', prep):''}${row('운', luck)}
      ${stale?`<div><span>같은 컨셉 반복</span><b class="down">-10%</b></div>`:''}
    </div>
    ${newly.length?`<div class="beat">${newly.map(r=>`<p><b>라이벌 ${r.name} 격파!</b> 팬 +${fmt(r.reward)}</p>`).join('')}</div>`:''}
    <h3>이번 주 차트</h3>
    ${chartRows(chart)}
    <div class="res" style="margin-top:12px">
      <div class="res-row">${avatar(lead.id,'big')}<div><b>오늘의 MVP ${BY_ID[lead.id].name}</b><span>"${rank<=10?'우리가 해냈어요! 믿을 수가 없어요!':rank<=50?'다음엔 더 위로 올라갈 수 있어요!':'아직 시작일 뿐이에요. 더 연습할게요!'}"</span></div></div>
    </div>
    <p class="center" style="margin-top:12px">팬 <span class="up">+${fmt(fansGain)}</span> · 수익 <span class="up">+${income}만원</span> · 모두 컨디션 -10</p>
    ${firstWin?'<img class="photo" src="assets/group_photo.jpg" alt="멤버 4명 단체 사진"><p class="center" style="margin-top:8px;font-family:var(--f-display);font-size:22px;color:var(--accent)">음원차트 1위 달성!</p>':''}
    <div class="row-btns"><button class="btn" data-close>확인</button></div>`, true);
  countRank(rank);
  renderMain();
}
function countRank(target){
  const el = $('#rk'); let cur = 100;
  const step = () => { cur = Math.max(target, cur - Math.max(1, Math.round((cur-target)/6))); if (el) el.innerHTML = `${cur}<small>위</small>`; if (cur>target) setTimeout(step, 40); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) el.innerHTML = `${target}<small>위</small>`; else step();
}

/* ───── 엔딩 ───── */
const RECORDS_KEY = 'nextbeat-records';
const SHARE_URL = 'https://claude.ai/artifact/Ltv4NvRCdE555X48X5tV9H'; // 게임 링크 (공유 글에 들어감)
function gradeOf(r){
  return !r ? ['F','결국 데뷔하지 못했어요. 다음엔 레슨을 더 열심히!']
    : r===1 ? ['S','음원차트 1위! 대한민국 최고의 걸그룹이 탄생했어요.']
    : r<=10 ? ['A','TOP 10 진입! 모두가 아는 그룹이 되었어요.']
    : r<=30 ? ['B','차트 상위권의 실력파 그룹으로 자리 잡았어요.']
    : r<=60 ? ['C','꾸준히 사랑받는 그룹이 되었어요.'] : ['D','아직 갈 길이 멀지만 팬들은 기다려줄 거예요.'];
}
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; }catch(e){ return []; } }
function saveRecord(s){
  const top = s.members.map(m=>({id:m.id, total:m.vocal+m.dance+m.charm})).sort((a,b)=>b.total-a.total)[0];
  const rec = { date:new Date().toISOString().slice(0,10), group:s.group, bestRank:s.bestRank, fans:s.fans,
    stages:s.stages.length, grade:gradeOf(s.bestRank)[0], ace:top.id };
  const list = [rec, ...loadRecords()].slice(0,10);
  try{ localStorage.setItem(RECORDS_KEY, JSON.stringify(list)); }catch(e){}
  return rec;
}
const shareText = rec => `[${rec.group}] 24개월 아이돌 육성 결과: 등급 ${rec.grade} · 최고 ${rec.bestRank ? '음원차트 '+rec.bestRank+'위' : '데뷔 실패'} · 팬 ${fmt(rec.fans)}명! 너도 키워봐 #NextBeat #아이돌키우기`;

// 결과 카드 이미지 (1080×1350) 그리기
function loadImg(src){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; }); }
async function drawCard(rec){
  try{ await document.fonts.load('80px "Jua"'); await document.fonts.load('800 30px "Gothic A1"'); }catch(e){}
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#1F2140'; g.fillRect(0,0,W,H);
  const photo = await loadImg(`assets/${rec.bestRank && rec.bestRank<=10 ? 'group_photo' : 'key_egoring'}.jpg`);
  g.drawImage(photo,0,0,W,W);
  const grad=g.createLinearGradient(0,W-420,0,W); grad.addColorStop(0,'rgba(31,33,64,0)'); grad.addColorStop(1,'rgba(31,33,64,1)');
  g.fillStyle=grad; g.fillRect(0,W-420,W,420);
  const D='"Jua","Gothic A1",sans-serif', B='"Gothic A1",sans-serif';
  g.textBaseline='alphabetic';
  g.fillStyle='rgba(244,242,255,.8)'; g.font=`600 34px ${B}`; g.fillText(`${rec.group} · 24개월의 기록`,64,W-150);
  g.fillStyle='#F4F2FF'; g.font=`120px ${D}`; g.fillText('등급',64,W-20);
  const gw=g.measureText('등급 ').width; g.fillStyle='#FF4F8B'; g.fillText(rec.grade,64+gw,W-20);
  // 숫자 칸
  const cells=[['최고 순위',rec.bestRank?rec.bestRank+'위':'-'],['팬',fmt(rec.fans)+'명'],['무대',rec.stages+'회']];
  const cw=(W-128-40)/3;
  cells.forEach(([k,v],i)=>{ const x=64+i*(cw+20), y=W+20;
    g.fillStyle='rgba(255,255,255,.08)'; roundRect(g,x,y,cw,136,24); g.fill();
    g.fillStyle='rgba(244,242,255,.7)'; g.font=`600 28px ${B}`; g.fillText(k,x+28,y+48);
    g.fillStyle='#F4F2FF'; g.font=`800 46px ${B}`; g.fillText(v,x+28,y+110); });
  g.fillStyle='rgba(244,242,255,.6)'; g.font=`600 28px ${B}`;
  g.fillText(`에이스 ${BY_ID[rec.ace]?.name||''} · ${rec.date}`,64,H-64);
  g.textAlign='right'; g.fillStyle='#FF4F8B'; g.font=`40px ${D}`; g.fillText('넥스트비트 데뷔 프로젝트',W-64,H-60);
  return c;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function showEnding(rec){
  const [grade, msg] = gradeOf(rec.bestRank);
  const t = encodeURIComponent(shareText(rec)), u = encodeURIComponent(SHARE_URL);
  $('#app').innerHTML = `
  <section class="title">
    <p>${esc(rec.group)} · ${LAST_MONTH}개월의 기록 · ${rec.date}</p>
    <h1>등급 <em>${grade}</em></h1>
    <p>${msg}</p>
    <div class="keyart" id="card"><img src="assets/${rec.bestRank && rec.bestRank<=10 ? 'group_photo' : 'key_egoring'}.jpg" alt="${esc(rec.group)} 멤버 4명"></div>
    <p class="hint" id="hint">결과 카드를 만드는 중…</p>
    <div class="wallet" style="margin:0">
      <div><span>최고 순위</span><b class="num">${rec.bestRank?rec.bestRank+'위':'-'}</b></div>
      <div><span>팬</span><b class="num">${fmt(rec.fans)}</b></div>
      <div><span>무대</span><b class="num">${rec.stages}회</b></div>
    </div>
    <div class="share">
      <h3>결과 공유하기</h3>
      <button class="btn gold" id="nshare" hidden>이미지와 함께 공유</button>
      <div class="sns">
        <a href="https://twitter.com/intent/tweet?text=${t}&url=${u}" target="_blank" rel="noopener">X</a>
        <a href="https://www.threads.net/intent/post?text=${t}%20${u}" target="_blank" rel="noopener">Threads</a>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${u}" target="_blank" rel="noopener">Facebook</a>
        <a href="https://social-plugins.line.me/lineit/share?url=${u}&text=${t}" target="_blank" rel="noopener">LINE</a>
        <button id="copy">글 복사</button>
      </div>
      <textarea id="stext" readonly rows="3">${esc(shareText(rec))} ${SHARE_URL}</textarea>
    </div>
    <div class="btns"><button class="btn" id="again">새 게임 시작</button></div>
  </section>`;
  $('#again').onclick = () => { try{ localStorage.removeItem(SAVE_KEY); }catch(e){} S=null; renderTitle(); };
  $('#copy').onclick = () => {
    const txt = $('#stext').value;
    const fallback = () => { const ta=$('#stext'); ta.focus(); ta.select(); toast('글이 선택됐어요. 복사해서 붙여넣어 주세요.'); };
    try { navigator.clipboard.writeText(txt).then(()=>toast('공유 글을 복사했어요. 인스타그램·카카오톡에 붙여넣어 보세요.'), fallback); } catch(e){ fallback(); }
  };
  drawCard(rec).then(canvas => {
    const url = canvas.toDataURL('image/jpeg', 0.9);
    $('#card').innerHTML = `<img src="${url}" alt="${esc(rec.group)} 결과 카드: 등급 ${grade}">`;
    $('#hint').textContent = '결과 카드 이미지를 길게 눌러 사진첩에 저장할 수 있어요.';
    canvas.toBlob(blob => {
      if (!blob || !navigator.canShare) return;
      const file = new File([blob], 'nextbeat-result.jpg', { type:'image/jpeg' });
      if (!navigator.canShare({ files:[file] })) return;
      const btn = $('#nshare'); btn.hidden = false;
      btn.onclick = () => navigator.share({ files:[file], text: shareText(rec), url: SHARE_URL }).catch(()=>{});
    }, 'image/jpeg', 0.9);
  }).catch(() => { $('#hint').textContent = '화면을 캡처해서 결과를 저장할 수 있어요.'; });
}
function openRecords(list){
  openSheet(`<button class="x" data-close aria-label="닫기">×</button><h2>지난 결과</h2>
    <div class="res">${list.map((r,i)=>`<button class="res-row rec" data-i="${i}">${avatar(r.ace,'big')}<div><b>${esc(r.group)} · 등급 ${r.grade}</b><span>${r.date} · 최고 ${r.bestRank?r.bestRank+'위':'-'} · 팬 ${fmt(r.fans)}</span></div></button>`).join('')}</div>`);
  document.querySelectorAll('.rec').forEach(b=>b.onclick=()=>{ closeSheet(); showEnding(list[+b.dataset.i]); });
}

/* ───── 시트 / 토스트 ───── */
function openSheet(html, modal){
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim'; scrim.id = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('click', e => {
    if (e.target.closest('[data-close]') || (!modal && e.target === scrim)) closeSheet();
  });
  document.body.appendChild(scrim);
}
function closeSheet(){ const s=$('#scrim'); if (s) s.remove(); }
function toast(t){ document.querySelectorAll('.toast').forEach(e=>e.remove()); const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

/* ───── 배경음악 ───── */
const MUSIC_KEY = 'nextbeat-music';
const bgm = new Audio('assets/bgm.mp3');
bgm.loop = true; bgm.volume = 0.45; bgm.preload = 'auto';
let musicOn = true;
try { musicOn = localStorage.getItem(MUSIC_KEY) !== 'off'; } catch(e){}
function playMusic(){ if (musicOn) bgm.play().catch(()=>{}); }
function setMusic(on){
  musicOn = on;
  try { localStorage.setItem(MUSIC_KEY, on ? 'on' : 'off'); } catch(e){}
  on ? playMusic() : bgm.pause();
  document.querySelectorAll('.music').forEach(b=>{ b.setAttribute('aria-pressed', on); b.textContent = on ? '♪ 음악 켜짐' : '♪ 음악 꺼짐'; });
}
const musicBtn = () => `<button class="music" aria-pressed="${musicOn}">${musicOn ? '♪ 음악 켜짐' : '♪ 음악 꺼짐'}</button>`;
// 브라우저 정책상 첫 터치 이후에만 소리가 나므로, 화면을 처음 누를 때 재생 시작
document.addEventListener('pointerdown', function first(){ playMusic(); document.removeEventListener('pointerdown', first); }, { once:true });
document.addEventListener('click', e => { if (e.target.closest('.music')) setMusic(!musicOn); });
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else if (musicOn && S) playMusic(); });

/* ───── 시작 ───── */
function start(){ renderTitle(); }
window.claude?.hot?.snapshot?.(() => ({}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
})();
</script>
