<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0818">
<title>고양이 타로 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0818; --bg2:#1b1033; --panel:rgba(28,18,52,.86); --panel2:rgba(40,26,72,.9);
  --line:rgba(226,192,107,.3); --gold:#e2c06b; --gold2:#f5dc9a;
  --text:#efe9fa; --muted:#a99fc6; --char:#b48cff;
  --f-body:"Noto Sans KR",system-ui,sans-serif; --f-deco:"Cormorant Garamond",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(ellipse 90% 50% at 50% 0%, #2a1652 0%, transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 100%, #24103a 0%, transparent 70%),
    var(--bg);
  min-height:100dvh; overflow-x:hidden;
}
body.has-input{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit}
.hidden{display:none!important}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.2;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.85}}

/* 상단 바 */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  max-width:480px;margin:0 auto;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.logo{font-family:var(--f-deco);font-weight:700;letter-spacing:.16em;font-size:18px;color:var(--gold)}
.logo small{display:block;font-family:var(--f-body);font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:400}
.top-btns{display:flex;gap:6px}
.icon-btn{height:36px;min-width:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
.icon-btn[aria-pressed="false"]{opacity:.55}
.icon-btn .dot{width:7px;height:7px;border-radius:50%;background:#6b6386}
.icon-btn .dot.on{background:#5fe0a0;box-shadow:0 0 6px #5fe0a0}

main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 16px 24px}

/* 시작 화면 */
.intro{text-align:center;padding:4px 0 10px}
.intro .cat-hero{width:220px;height:220px;margin:4px auto 10px;position:relative}
.intro .cat-hero .aura{inset:-10px}
.intro .cat-hero .catbox{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--char);
  box-shadow:0 0 0 6px rgba(13,8,24,.8),0 0 0 7px var(--line);background:radial-gradient(circle at 50% 35%,#3b2370,#1a0f33)}
.intro h1{font-size:23px;font-weight:700;line-height:1.4}
.intro h1 em{font-style:normal;color:var(--gold)}
.intro p{color:var(--muted);font-size:14px;line-height:1.6;margin-top:8px}
.how{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.how span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--gold2)}
.start-btns{display:grid;gap:10px;margin-top:22px}
.ai-state{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.ai-state b{color:var(--gold2);font-weight:500}
.ai-state button{color:var(--gold2);text-decoration:underline;font-size:12.5px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
.note a{color:var(--gold2)}

/* 상담실 */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 14px}
.avatar-wrap{position:relative;width:184px;height:184px;flex:none}
.aura{position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle,var(--char) 0%,transparent 68%);opacity:.32;transition:opacity .3s}
#avatar{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--char);
  box-shadow:0 0 0 6px rgba(13,8,24,.8),0 0 0 7px var(--line);background:radial-gradient(circle at 50% 35%,#3b2370,#1a0f33)}
.catbox img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
#avatar img{transform:scale(1.12) translateY(4%)}
.eq{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);display:flex;gap:3px;align-items:flex-end;height:16px;
  padding:3px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--char);opacity:0;transition:opacity .2s}
.eq i{width:3px;height:4px;background:var(--char);border-radius:2px}
.speaking .eq{opacity:1}
.speaking .eq i{animation:eq .5s ease-in-out infinite alternate}
.speaking .eq i:nth-child(2){animation-delay:.15s}.speaking .eq i:nth-child(3){animation-delay:.3s}.speaking .eq i:nth-child(4){animation-delay:.08s}
@keyframes eq{to{height:10px}}
.speaking #avatar img{animation:talk .42s ease-in-out infinite alternate}
.speaking .aura{opacity:.55;animation:aura 1.2s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1.12) translateY(4%)}to{transform:scale(1.15) translateY(2%) rotate(1deg)}}
@keyframes aura{to{transform:scale(1.06)}}


.dialog{position:relative;width:100%;min-height:104px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px 18px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.who{position:absolute;top:-11px;left:14px;font-size:12px;font-weight:700;color:#120a26;background:var(--char);border-radius:999px;padding:3px 10px}
#line{font-size:16px;line-height:1.7;min-height:54px;word-break:keep-all;white-space:pre-wrap}
.next-mark{position:absolute;right:14px;bottom:6px;color:var(--gold);font-size:12px;opacity:0}
.waiting .next-mark{opacity:1;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.next-row{display:flex;justify-content:center;margin-top:-4px;margin-bottom:10px}

/* 작은 상담 모드(카드 고르기, 결과) */
#room.compact .stage{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:20;flex-direction:row;align-items:center;gap:12px;
  padding:8px 0 10px;background:linear-gradient(180deg,var(--bg) 85%,transparent)}
#room.compact .avatar-wrap{width:76px;height:76px}
#room.compact .aura{inset:-8px}
#room.compact #avatar{box-shadow:0 0 0 3px rgba(13,8,24,.8),0 0 0 4px var(--line)}
#room.compact .eq{bottom:-6px;height:12px;padding:2px 5px}
#room.compact .dialog{min-height:76px;padding:12px 14px 14px}
#room.compact #line{font-size:14.5px;min-height:0;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a0f2e;box-shadow:0 4px 18px rgba(226,192,107,.25)}
.btn:active{transform:translateY(1px)}
.btn.big{padding:16px 18px;font-size:17px}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.danger{background:rgba(255,93,122,.12);color:#ff9fb0;border:1px solid rgba(255,93,122,.35);box-shadow:none;font-weight:500}
.btn[disabled]{opacity:.4;pointer-events:none}

.panel h2{font-size:17px;text-align:center;font-weight:700}
.panel .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.6}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chip{text-align:left;font-size:14px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.chip:active{background:rgba(226,192,107,.12)}
.chips-head{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:12px;color:var(--muted)}
.chips-head button{font-size:12px;color:var(--gold2)}

/* 타로 카드 */
.tcard{position:relative;aspect-ratio:2/3;perspective:800px;container-type:inline-size}
.tcard .inner{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.tcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:8%/5.4%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:
   radial-gradient(circle at 50% 50%,rgba(226,192,107,.35) 0 8%,transparent 9%),
   repeating-linear-gradient(45deg,rgba(226,192,107,.08) 0 2px,transparent 2px 9px),
   linear-gradient(160deg,#3b1a6e,#1d0d3c);
  border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px #1d0d3c,inset 0 0 0 4px rgba(226,192,107,.5)}
.back::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-size:30cqw}
.front{transform:rotateY(180deg);background:linear-gradient(165deg,#2e1858,#140a2a 70%);border:1.5px solid var(--gold);
  box-shadow:inset 0 0 0 3px #140a2a,inset 0 0 0 4px rgba(226,192,107,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:9cqw 6cqw 8cqw;text-align:center}
.front .rn{font-family:var(--f-deco);font-weight:700;color:var(--gold);font-size:13cqw;line-height:1}
.front .sym{font-size:40cqw;line-height:1;filter:drop-shadow(0 0 6px rgba(226,192,107,.4))}
.front .cn{font-size:11.5cqw;font-weight:700;color:var(--gold2);line-height:1.2;word-break:keep-all}

.pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}
.pick-grid .tcard{cursor:pointer;transition:transform .2s}
.pick-grid .tcard:hover{transform:translateY(-3px)}
.pick-grid .tcard.picked{transform:translateY(-6px)}
.pick-grid .tcard.picked .back{box-shadow:inset 0 0 0 3px #1d0d3c,inset 0 0 0 4px rgba(226,192,107,.5),0 0 14px var(--gold)}
.badge{position:absolute;top:-6px;right:-6px;z-index:2;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1a0f2e;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pick-grid.done .tcard:not(.picked){opacity:.35;pointer-events:none}

.shuffle{position:relative;height:200px;margin-top:10px}
.shuffle .tcard{position:absolute;left:50%;top:10px;width:110px;margin-left:-55px}
.shuffle .tcard:nth-child(1){animation:sh1 1.1s ease-in-out infinite}
.shuffle .tcard:nth-child(2){animation:sh2 1.1s ease-in-out infinite}
.shuffle .tcard:nth-child(3){animation:sh1 1.1s .35s ease-in-out infinite}
.shuffle .tcard:nth-child(4){animation:sh2 1.1s .35s ease-in-out infinite}
@keyframes sh1{50%{transform:translateX(-58px) rotate(-10deg)}}
@keyframes sh2{50%{transform:translateX(58px) rotate(10deg)}}

.spread{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.slot .pos{text-align:center;font-size:12px;color:var(--gold2);margin-bottom:6px;letter-spacing:.1em}
.slot .cap{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}
.slot.active .tcard{filter:drop-shadow(0 0 12px rgba(226,192,107,.55))}

/* 결과 */
.result-q{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6}
.result-q b{color:var(--gold2);margin-right:6px;font-weight:700}
.rcards{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rcard{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.rcard .tcard{width:62px;flex:none}
.rcard .t{font-size:12px;color:var(--gold2);letter-spacing:.06em}
.rcard .n{font-size:15px;font-weight:700;margin-top:2px}
.rcard .n small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.rcard .m{font-size:13px;color:#d7cfe8;line-height:1.6;margin-top:4px;word-break:keep-all}
.summary{margin-top:14px;background:linear-gradient(160deg,rgba(226,192,107,.12),rgba(167,139,250,.08));border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.summary h3{font-size:14px;color:var(--gold);margin-bottom:8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.summary h3 small{font-size:11px;color:var(--muted);font-weight:400}
.summary p{font-size:14px;line-height:1.75;word-break:keep-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.log-title{font-size:13px;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.log-title::after{content:"";flex:1;height:1px;background:var(--line)}
.log{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .mini{width:30px;height:30px;border-radius:50%;overflow:hidden;border:1.5px solid var(--char);flex:none;background:#2a1850}
.msg p{font-size:14px;line-height:1.6;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--panel2);word-break:keep-all}
.msg.me{align-self:flex-end}
.msg.me p{background:rgba(226,192,107,.18);border-radius:14px 14px 4px 14px}
.msg .play{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:11px;color:var(--gold2)}

/* 입력 바 */
.inputbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 75%,transparent)}
.inputbar .row{max-width:448px;margin:0 auto;display:flex;gap:8px;align-items:center}
#mic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--char);color:#120a26;
  box-shadow:0 0 0 4px rgba(13,8,24,.9),0 0 0 5px var(--line);display:flex;align-items:center;justify-content:center}
#mic svg{width:24px;height:24px}
#mic.on{background:#ff5d7a;animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 4px rgba(13,8,24,.9),0 0 0 12px rgba(255,93,122,.35)}}
#text{flex:1;min-width:0;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font-size:16px;outline:none}
#text:focus{border-color:var(--gold)}
#send{flex:none;height:48px;padding:0 16px;border-radius:24px;background:rgba(226,192,107,.18);color:var(--gold2);font-weight:700;font-size:14px}
.mic-hint{max-width:448px;margin:0 auto 6px;font-size:12px;color:var(--gold2);text-align:center}

/* 설정 창 */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,2,12,.7);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:#160d2c;border:1px solid var(--line);border-bottom:0;
  border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-size:22px;color:var(--muted);width:36px;height:36px}
.sheet .desc{font-size:13px;color:var(--muted);line-height:1.65;margin-top:8px}
.field{margin-top:16px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--gold2)}
.field .row{display:flex;gap:6px}
.field input,.field select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.field .row button{flex:none;padding:0 12px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.field small{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.field small a{color:var(--gold2)}
.field .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.sheet .btns .wide{grid-column:1/-1}
.test-out{margin-top:12px;font-size:13px;line-height:1.6;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.test-out.ok{border-color:rgba(95,224,160,.5);color:#b9f3d6}
.test-out.err{border-color:rgba(255,93,122,.5);color:#ffb3c1}
.warn{margin-top:16px;font-size:12px;line-height:1.65;color:#e9d8a6;background:rgba(226,192,107,.08);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:90;
  background:#2c1d4e;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;
  transition:.25s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:360px){
  .pick-grid{grid-template-columns:repeat(5,1fr)}
  .avatar-wrap{width:150px;height:150px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<header class="top">
  <div class="logo">CAT TAROT<small>고양이와 목소리로 나누는 타로 상담</small></div>
  <div class="top-btns">
    <button class="icon-btn" id="voiceBtn" aria-pressed="true" title="목소리 켜기/끄기">🔊</button>
    <span class="icon-btn" id="aiBadge" title="AI 연결 상태"><span class="dot" id="aiDot"></span>AI</span>
    <button class="icon-btn hidden" id="homeBtn" title="처음으로">⌂</button>
  </div>
</header>

<main>
  <!-- 1. 시작 화면 -->
  <section id="select">
    <div class="intro">
      <div class="cat-hero"><div class="aura"></div><div class="catbox" id="heroCat"></div></div>
      <h1>타로 고양이 <em id="heroName"></em>에게<br>무엇이든 물어보세요</h1>
      <p>고양이가 직접 목소리로 이야기하며 카드를 읽어 줘요.</p>
      <div class="how"><span>🔊 소리를 켜 주세요</span><span>🎤 말로 질문해도 돼요</span><span>🃏 카드 3장</span></div>
      <div class="start-btns">
        <button class="btn big" id="startBtn">상담 시작하기</button>
        <p class="ai-state" id="aiState"></p>
      </div>
    </div>
    <p class="note">마이크 입력은 크롬·사파리·삼성 인터넷에서 돼요. 안 되면 글로 적어도 똑같이 상담할 수 있어요.<br>
      <a href="game.html">← 넥스트비트 데뷔 프로젝트(육성 게임)로</a></p>
  </section>

  <!-- 2. 상담실 -->
  <section id="room" class="hidden">
    <div class="stage" id="stage">
      <div class="avatar-wrap">
        <div class="aura"></div>
        <div id="avatar" class="catbox"></div>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="dialog" id="dialog" role="button" tabindex="0" aria-live="polite">
        <span class="who" id="who"></span>
        <p id="line"></p>
        <span class="next-mark">▼</span>
      </div>
    </div>
    <div class="next-row hidden" id="nextRow"><button class="btn" id="nextBtn">다음 ▶</button></div>
    <div class="panel" id="panel"></div>
    <div id="logWrap" class="hidden">
      <div class="log-title">대화 기록</div>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<div class="inputbar hidden" id="inputbar">
  <div class="mic-hint" id="micHint"></div>

// 한국어 조사: josa('바보','이에요/예요') → '바보예요'
function josa(word, pair){
  const [a,b] = pair.split('/');
  const ch = String(word).trim().slice(-1).charCodeAt(0);
  if (ch < 0xAC00 || ch > 0xD7A3) return word + b;
  const jong = (ch - 0xAC00) % 28;
  if (pair === '으로/로') return word + (jong === 0 || jong === 8 ? b : a);
  return word + (jong ? a : b);
}

// 해요체 → 고양이 말투(~다냥). 미리 써 둔 카드 문장에만 씀
const ADJ_HAE = /(필요|중요|충분|확실|안전|유리|강|비슷|가능|소중|분명|조용|편안|따뜻|행복|불안|답답|신중|적당|풍성|넉넉|다정|단단|순수|공정|유연|건강)해요$/;
const NYAN_RULES = [
  [/마세요$/, '말라냥'], [/세요$/, '라냥'], [/이에요$/, '이다냥'], [/예요$/, '다냥'],
  [/(있|없|않|좋|같|많|싫|괜찮|작|높|낮|깊|넓|맞|늦|빠르)어요$/, '$1다냥'], [/(있|없|않|좋|같|많|괜찮|작|높|낮|깊|넓|맞|늦)아요$/, '$1다냥'],
  [/게요$/, '게냥'], [/까요$/, '까냥'], [/돼요$/, '된다냥'], [/보여요$/, '보인다냥'], [/와요$/, '온다냥'],
  [/줘요$/, '준다냥'], [/져요$/, '진다냥'], [/려요$/, '린다냥'], [/나요$/, '난다냥'], [/겨요$/, '긴다냥'],
  [/커요$/, '크다냥'], [/밝아요$/, '밝다냥'], [/받아요$/, '받는다냥'], [/믿어요$/, '믿는다냥'], [/미뤄요$/, '미룬다냥'],
  [/몰라요$/, '모른다냥'], [/봐요$/, '본다냥'], [/가요$/, '간다냥'],
];
function nyan(text){
  return String(text).replace(/(\S+)요(?=[.!?,]|\s|$)/g, (m, w) => {
    const word = w + '요';
    if (ADJ_HAE.test(word)) return word.replace(/해요$/, '하다냥');
    if (/해요$/.test(word)) return word.replace(/해요$/, '한다냥');
    for (const [re, rep] of NYAN_RULES){
      if (re.test(word)) return rep === null ? w + '냥' : word.replace(re, rep);
    }
    return w + '냥';
  });
}

// 문장 단위로 나누기(문장 끝 부호 + 공백 기준)
function splitSentences(text){
  const out=[]; let cur='';
  for (let i=0;i<text.length;i++){
    cur += text[i];
    if (/[.!?]/.test(text[i]) && (i+1>=text.length || /\s/.test(text[i+1]))){ out.push(cur.trim()); cur=''; }
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

const Voice = {
  supported: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  on: store('nbt_voice') !== '0',
  voice: null,
  init(){
    if (!this.supported){ this.on=false; return; }
    const choose = () => {
      const vs = speechSynthesis.getVoices();
      const ko = vs.filter(v => /^ko/i.test(v.lang) || /korean|한국/i.test(v.name));
      const prefer = [/yuna|유나/i, /sunhi|sun-hi|선희/i, /heami|혜미/i, /google/i, /female|여성/i];
      this.voice = prefer.map(r => ko.find(v => r.test(v.name))).find(Boolean) || ko[0] || null;
    };
    choose();
    speechSynthesis.addEventListener?.('voiceschanged', choose);
  },
  unlock(){ // iOS: 첫 재생은 반드시 터치 이벤트 안에서
    CloudVoice.unlock();
    if (!this.supported) return;
    try { const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ko-KR'; speechSynthesis.speak(u); } catch {}
  },
  stop(){ CloudVoice.stop(); if (this.supported) try{ speechSynthesis.cancel(); }catch{} },
  clean(t){
    return t.replace(/[「」『』"“”'‘’()*#_~\-]/g,' ').replace(/…+/g,', ').replace(/\p{Extended_Pictographic}/gu,'')
            .replace(/^[,\s]+/,'').replace(/\s+/g,' ').trim();
  },
  speak(text){
    return new Promise(resolve => {
      const t = this.clean(text);
      if (!this.supported || !this.on || !t){ resolve(); return; }
      let done=false;
      const fin = () => { if(done) return; done=true; clearTimeout(timer); resolve(); };
      const u = new SpeechSynthesisUtterance(t);
      u.lang='ko-KR'; if (this.voice) u.voice=this.voice;
      u.pitch = CAT.pitch; u.rate = CAT.rate; u.volume = 1;
      u.onend = fin; u.onerror = fin;
      const timer = setTimeout(fin, 3000 + t.length * 260 / CAT.rate); // onend가 안 오는 브라우저 대비
      try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch { fin(); }
    });
  },
};

/* ═════════════ OpenAI 목소리 (TTS) ═════════════ */
const CloudVoice = {
  ctx:null, src:null, ctrl:null, failed:false,
  usable(){ return Voice.on && AI.ttsOn() && !this.failed; },
  unlock(){
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch {}
  },
  stop(){
    if (this.ctrl){ this.ctrl.abort(); this.ctrl = null; }
    if (this.src){ try{ this.src.stop(); }catch{} this.src = null; }
  },
  // 다 읽으면 true, 실패하면 false(→ 브라우저 목소리로 대신 읽기)
  async speak(text){
    this.stop(); this.unlock();
    const ctrl = new AbortController(); this.ctrl = ctrl;
    let buf;
    try {
      const res = await AI.post('tts', { text:Voice.clean(text) }, ctrl.signal);
      const ab = await res.arrayBuffer();
      if (ctrl.signal.aborted) return true;
      buf = await new Promise((ok, no) => this.ctx.decodeAudioData(ab, ok, no));
    } catch (e) {
      if (e.name === 'AbortError' || ctrl.signal.aborted) return true;
      this.failed = true;
      toast(`OpenAI 목소리를 못 불러와서 기본 목소리로 바꿀게요 (${e instanceof TypeError ? '연결 실패' : (e.message || '재생 오류')})`, 4200);
      return false;
    }
    if (ctrl.signal.aborted) return true;
    this.ctrl = null;
    return new Promise(resolve => {
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.connect(this.ctx.destination);
      src.onended = () => { if (this.src === src) this.src = null; resolve(true); };
      this.src = src; src.start();
    });
  },
};

async function replay(text){
  skipSay(); Voice.stop();
  if (CloudVoice.usable() && await CloudVoice.speak(text)) return;
  for (const s of splitSentences(text)) await Voice.speak(s);
}

  $('#micHint').textContent = !on ? '' : mode === 'record' ? '녹음 중… 다 말했으면 마이크를 한 번 더 눌러 주세요' : '듣고 있어요… 말이 끝나면 자동으로 보내요';
}
let mediaRec = null, recTimer = null;
const canRecord = () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
async function toggleRecord(){
  if (mediaRec && mediaRec.state === 'recording'){ mediaRec.stop(); return; }
  skipSay(); Voice.stop();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch { toast('마이크 사용을 허용해 주세요. 글로 적어도 돼요.'); return; }
  const chunks = [];
  const rec2 = mediaRec = new MediaRecorder(stream);
  rec2.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec2.onstop = async () => {
    clearTimeout(recTimer); stream.getTracks().forEach(t => t.stop()); setMicUI(false);
    const blob = new Blob(chunks, { type: rec2.mimeType || 'audio/webm' });
    if (blob.size < 2000){ toast('너무 짧아요. 다시 말해 주세요.'); return; }
    $('#micHint').textContent = '말한 내용을 글로 바꾸는 중…';
    try {
      const t = (await AI.transcribe(blob)).trim();
      $('#micHint').textContent = '';
      if (t){ $('#text').value = t; submitInput(); } else toast('잘 안 들렸어요. 다시 말해 주세요.');
    } catch (e){ $('#micHint').textContent = ''; toast(`음성 인식 실패: ${e.message}`, 3600); }
  };
  rec2.start(); setMicUI(true, 'record');
  recTimer = setTimeout(() => { if (rec2.state === 'recording') rec2.stop(); }, 15000);
}
function toggleListen(){
  if (!SR && AI.on() && canRecord()) return toggleRecord();
  if (!SR){ toast('이 브라우저는 음성 입력이 안 돼요. 글로 적어 주세요.', 3600); $('#text').focus(); return; }
  if (listening){ try{ rec.stop(); }catch{} return; }
  skipSay(); Voice.stop();
  rec = new SR();
  rec.lang='ko-KR'; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  let finalText='';
  rec.onresult = e => {
    let interim='';
    for (let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    $('#text').value = (finalText + interim).trim();
  };
  rec.onerror = e => {
    if (e.error==='not-allowed' || e.error==='service-not-allowed') toast('마이크 사용을 허용해 주세요. 글로 적어도 돼요.');
    else if (e.error==='no-speech') toast('잘 안 들렸어요. 다시 눌러서 말해 주세요.');
    else if (e.error!=='aborted') toast('음성 인식이 잠시 안 돼요. 글로 적어 주세요.');
  };
  rec.onend = () => { setMicUI(false); if (finalText.trim()) submitInput(); };
  try { rec.start(); setMicUI(true); } catch { setMicUI(false); }
}

/* ═════════════ AI 해석 (우리 서버 → OpenAI) ═════════════ */
// 페이지는 OpenAI 키를 모른다. /api/* 서버 함수가 키를 붙여 OpenAI에 대신 요청한다.
const AI = {
  ready:false, tts:false,
  on(){ return this.ready; },
  ttsOn(){ return this.tts; },
  async init(){
    try {
      const r = await fetch('api/status', { cache:'no-store' });
      if (r.ok){ const d = await r.json(); this.ready = !!d.ai; this.tts = !!d.tts; }
    } catch {}
    renderAiState();
  },
  async post(path, body, signal){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 70000);
    if (signal) signal.addEventListener('abort', () => ctrl.abort());
    let res;
    try {
      res = await fetch(`api/${path}`, { method:'POST', signal:ctrl.signal, headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    } catch (e) {
      if (signal?.aborted) throw Object.assign(new Error('aborted'), { name:'AbortError' });
      throw new Error(e.name === 'AbortError' ? '응답이 너무 늦어요(시간 초과)' : '서버에 연결하지 못했어요');
    } finally { clearTimeout(timer); }
    if (!res.ok){ const d = await res.json().catch(() => ({})); throw new Error(d.error || `서버 오류 (${res.status})`); }
    return res;
  },
  cards(){ return S.picks.map((c,i) => ({ pos:POS[i], name:c.name, key:c.key })); },
  async chat(body){ return (await (await this.post('chat', body)).json()).result; },
  reading(){ return this.chat({ type:'reading', question:S.q, cards:this.cards() }); },
  extra(card){
    return this.chat({ type:'extra', question:S.q, cards:this.cards(), summary:S.ai?.summary || S.readingText, extra:{ name:card.name, key:card.key } })
      .then(r => r.text);
  },
  follow(question){
    const cards = this.cards();
    if (S.extra) cards.push({ pos:'심층(추가 카드)', name:S.extra.name, key:S.extra.key });
    return this.chat({ type:'follow', question:S.q, cards, reading: S.ai ? `${S.ai.summary} ${S.ai.advice}` : S.readingText,
      history:S.chat, followUp:question });
  },
  async transcribe(blob){
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = ''; for (let k=0; k<buf.length; k+=0x8000) bin += String.fromCharCode.apply(null, buf.subarray(k, k+0x8000));
    const r = await this.post('stt', { audio:btoa(bin), mime:blob.type || 'audio/webm' });
    return (await r.json()).text || '';
  },
};

const S = { q:'', topic:'gen', deck:[], picks:[], extra:null, follow:0, pickNeed:0, pickPool:null,
            ai:null, aiExtra:'', chat:[], readingText:'' };
let TOKEN = 0;          // 흐름이 바뀌면 이전 흐름은 멈춤
class Abort {}
const live = tok => { if (tok !== TOKEN) throw new Abort(); };
const run = fn => fn().catch(e => { if (!(e instanceof Abort)) console.error(e); });
let sayCtl = null, waitResolve = null, pickResolve = null, inputHandler = null;

function newFlow(){
  TOKEN++;
  skipSay(); Voice.stop();
  waitResolve = null; pickResolve = null;
  showNext(false);
  return TOKEN;

function setExpr(expr){
  const img = $('#avatar img');
  if (img){ const src = catSrc(expr); if (!img.src.endsWith(src)) img.src = src; }
  else $('#avatar').innerHTML = catArt(expr);
}
function setSpeaking(on){ $('#stage').classList.toggle('speaking', on); }
function skipSay(){ if (sayCtl) sayCtl.skip(); }

// 고양이가 말하기: 자막(타이핑) + 목소리. 끝나면 resolve
function say(text, expr, {log=true}={}){
  skipSay();
  if (expr) setExpr(expr);
  if (log) addLog('cat', text);
  const lineEl = $('#line');
  lineEl.textContent = '';
  $('#dialog').classList.remove('waiting');
  return new Promise(resolve => {
    const sentences = splitSentences(text);
    let shown = '', idx = 0, typer = null, ended = false;
    const ctl = { skip(){ if (ended) return; ended = true; Voice.stop(); finish(); } };
    function finish(){
      ended = true; clearInterval(typer);
      lineEl.textContent = text;
      if (sayCtl === ctl){ sayCtl = null; setSpeaking(false); }
      resolve();
    }
    sayCtl = ctl;
    setSpeaking(true);
    if (CloudVoice.usable()){
      (async () => {
        let k = 0;
        typer = setInterval(() => { k++; lineEl.textContent = text.slice(0,k); if (k >= text.length) clearInterval(typer); }, 55);
        const ok = await CloudVoice.speak(text);
        if (ended) return;
        if (!ok) for (const s of sentences){ await Voice.speak(s); if (ended) return; }
        finish();
      })();
      return;
    }
    (async function next(){
      while (!ended && idx < sentences.length){
        const s = sentences[idx++];
        const base = shown ? shown + ' ' : '';
        let k = 0; clearInterval(typer);
        const speed = Voice.on ? 70 : 38;
        typer = setInterval(() => { k++; lineEl.textContent = base + s.slice(0,k); if (k >= s.length) clearInterval(typer); }, speed);
        if (Voice.on && Voice.supported) await Voice.speak(s);
        else await sleep(s.length * speed + 350);
        if (ended) return;
        clearInterval(typer);
        shown = base + s; lineEl.textContent = shown;
      }
      if (!ended) finish();
    })();
  });
}

function showNext(on){
  $('#nextRow').classList.toggle('hidden', !on);
  $('#dialog').classList.toggle('waiting', on);
}
function waitNext(){
  showNext(true);
  return new Promise(r => { waitResolve = () => { waitResolve = null; showNext(false); r(); }; });
}
function onDialogTap(){
  if (sayCtl) { sayCtl.skip(); return; }
  if (waitResolve) waitResolve();
}
// AI 응답을 기다리는 동안 고양이가 한마디 하고, 둘 다 끝나면 결과 반환
async function withThinking(promise, line, tok){
  let settled = false;
  promise.then(() => settled = true, () => settled = true);
  await Promise.race([promise.catch(()=>{}), sleep(350)]);
  live(tok);
  if (!settled){
    $('#nextRow').classList.add('hidden');
    await say(line, 'thinking', {log:false}); live(tok);
  }
  try { return await promise; } finally { live(tok); }
}

/* ═════════════ 질문 분석 (기본 해석용) ═════════════ */
function detectQ(text){
  const t = text || '';
  let topic = 'gen';
  if (/최애|아이돌|멤버|컴백|콘서트|티켓|팬싸|팬미|사인회|덕질|스밍|투표|차트|앨범|음원|굿즈|공연|1위|무대|팬/.test(t)) topic='fan';
  else if (/연애|사랑|썸|짝사랑|애인|남친|여친|남자\s*친구|여자\s*친구|고백|재회|이별|헤어|연락|좋아하는\s*사람|결혼|인연|그\s*사람/.test(t)) topic='love';
  else if (/취업|이직|직장|회사|시험|합격|공부|학교|성적|면접|오디션|진로|프로젝트|승진|알바|사업|입시|자격증/.test(t)) topic='work';
  else if (/돈|금전|재물|월급|수입|투자|주식|코인|용돈|저축|대출|재테크/.test(t)) topic='money';
  return {
    topic,
    timing: /언제|시기|몇\s*월|얼마나\s*(걸|기다)/.test(t),
    yesno: /(될까|할까|있을까|맞을까|괜찮을까|가능할까|좋을까|붙을까|닿을까|통할까|성공할|합격할|당첨될|잘\s*될|되나요|할\s*수\s*있)/.test(t),
    advice: /어떻게|어떡|뭘|무엇을|뭐를|방법|조언|해야|필요한/.test(t),
  };
}
function levelOf(cards){
  const avg = cards.reduce((s,c)=>s+ENERGY_SCORE[c.e],0) / cards.length;
  return avg >= 1.47 ? 'high' : avg >= 0.93 ? 'mid' : 'low';
}
const LV_EXPR = { high:'bigsmile', mid:'smile', low:'serious' };
const YES = {
  high:'질문에 대한 답은, 좋은 쪽으로 크게 기울어 있다냥. 가능성이 높다냥.',
  mid:'가능성은 충분하다냥. 다만 저절로 되기보다는, 조금 더 준비하고 움직일수록 결과가 좋아지는 흐름이다냥.',
  low:'솔직히 지금 흐름 그대로라면 쉽지는 않다냥. 그래도 카드는 방법을 바꾸면 달라질 수 있다고 말한다냥.',
};
const GEN = {
  high:'전체적으로 아주 밝은 흐름이다냥. 지금 마음먹은 방향이 맞다냥.',
  mid:'좋은 점과 신경 쓸 점이 섞여 있지만, 결국은 충분히 좋아질 수 있는 흐름이다냥.',
  low:'지금은 조금 힘든 구간이다냥. 그래도 이 시기를 잘 지나면 분명 달라진다냥.',
};
const meaningOf = (card, topic) => nyan(card[topic] || card.gen);
const advOf = card => nyan(card.adv);
const whenOf = card => nyan(josa(card.when,'이에요/예요'));

function cardHead(card, pos){ return `${POS_INTRO[pos]} 나온 카드는 ${card.name}, ${card.key}의 카드다냥.`; }
function cardLine(card, pos, aiText){
  if (aiText) return `${cardHead(card,pos)} ${aiText}`;
  return `${cardHead(card,pos)} ${meaningOf(card, S.topic)} ${pickOne(CAT.react[card.e])}`;
}
function summaryLines(){
  const [p,c,f] = S.picks;
  if (S.ai){
    const lv = ['high','mid','low'].includes(S.ai.mood) ? S.ai.mood : levelOf(S.picks);
    return { a:`${CAT.sumIntro} ${S.ai.summary}`, b:S.ai.advice, lv, text:`${S.ai.summary} ${S.ai.advice}` };
  }
  const it = detectQ(S.q);
  const lv = levelOf(S.picks);
  let ans;
  if (it.timing) ans = `궁금해한 시기는 미래 카드 ${josa(f.name,'이/가')} 알려 준다냥. ${whenOf(f)}. ${GEN[lv]}`;
  else if (it.yesno) ans = YES[lv];
  else ans = GEN[lv];
  const a = `${CAT.sumIntro} ${p.name}에서 시작해서, 지금은 ${c.name}, 그리고 앞으로는 ${josa(f.name,'으로/로')} 이어지는 흐름이다냥. ${ans}`;
  let b = `카드가 주는 조언은 이거다냥. ${advOf(f)}`;
  if (c.e === 'caution') b += ` 그리고 지금은, ${advOf(c)}`;
  b += ` ${CAT.close[lv]}`;
  return { a, b, lv, text: `${ans} ${advOf(f)}` };
}
function followAnswer(t){
  const it = detectQ(t);
  const topic = it.topic !== 'gen' ? it.topic : S.topic;
  const [p,c,f] = S.picks;
  const all = S.extra ? [...S.picks, S.extra] : S.picks;
  const named = all.find(x => t.includes(x.name))
    || (/과거/.test(t) && p) || (/현재/.test(t) && c) || (/미래|앞으로/.test(t) && f)
    || (/추가|심층|마지막\s*카드/.test(t) && S.extra) || null;
  const open = pickOne(CAT.followOpen);
  if (named) return { expr:ENERGY_EXPR[named.e], text:`${open} ${named.name} 카드 말이다냥. ${meaningOf(named, topic)} 조언하자면, ${advOf(named)}` };
  if (it.timing){
    const k = S.extra || f;
    return { expr:'neutral', text:`${open} 시기로 보면 ${k.name} 카드가 힌트다냥. ${whenOf(k)}. 너무 조급해하지 않아도 된다냥.` };
  }
  if (it.advice) return { expr:'smile', text:`${open} 지금 카드 ${josa(c.name,'은/는')} 이렇게 말한다냥. ${advOf(c)} 그리고 앞으로를 위해서는, ${advOf(f)}` };
  if (it.yesno){ const lv = levelOf(all); return { expr:LV_EXPR[lv], text:`${open} ${YES[lv]}` }; }
  if (topic !== S.topic) return { expr:ENERGY_EXPR[c.e], text:`${open} 그 부분은 현재 카드 ${josa(c.name,'으로/로')} 볼 수 있다냥. ${meaningOf(c, topic)} ${advOf(c)}` };
  return { expr:'neutral', text:`${open} 카드 흐름을 다시 보면, 지금은 ${c.name}의 ${c.key}, 앞으로는 ${f.name}의 ${josa(f.key,'이/가')} 핵심이다냥. ${advOf(f)}` };
}

  $('#aHome').onclick = goHome;
}

/* ═════════════ 카드 고르기 ═════════════ */
function onPick(card, el){
  if (!pickResolve || el.classList.contains('picked')) return;
  const picked = S.pickPool;
  if (picked.length >= S.pickNeed) return;
  picked.push(card);
  el.classList.add('picked');
  el.insertAdjacentHTML('beforeend', `<span class="badge">${picked.length}</span>`);
  $('#pickCount').textContent = $('#pickCount').textContent.replace(/\d+ \/ /, `${picked.length} / `);
  if (S.pickNeed === 3) say(CAT.pickReact[picked.length-1], picked.length===3 ? 'bigsmile' : 'smile', {log:false});
  if (picked.length >= S.pickNeed){
    $('#pickGrid').classList.add('done');
    const r = pickResolve; pickResolve = null; r(picked);
  }
}
function waitPicks(need){
  S.pickNeed = need; S.pickPool = [];
  return new Promise(r => { pickResolve = r; });
}

/* ═════════════ 상담 흐름 ═════════════ */
function goHome(){
  newFlow(); setInput(null);
  $('#room').classList.add('hidden'); $('#select').classList.remove('hidden');
  $('#homeBtn').classList.add('hidden');
  renderAiState();
  window.scrollTo(0,0);
}
function enterRoom(){
  Voice.unlock();
  $('#who').textContent = CAT.name;
  $('#select').classList.add('hidden'); $('#room').classList.remove('hidden');
  $('#homeBtn').classList.remove('hidden');
  clearLog();
  window.scrollTo(0,0);
  run(() => phaseAsk(true));
}
async function phaseAsk(first){
  const tok = newFlow();
  setPhase('ask'); renderAsk();
  setInput(handleQuestion, '궁금한 걸 말하거나 적어 주세요');
  window.scrollTo(0,0);
  for (const l of (first ? CAT.greet : CAT.again)){ await say(l, 'smile'); live(tok); }
}
function handleQuestion(text){
  const q = text.trim().slice(0,150);
  if (q.replace(/\s/g,'').length < 2){ run(async()=>{ await say(CAT.unclear,'surprised',{log:false}); }); return; }
  S.q = q;
  run(flowReading);
}
async function flowReading(){
  const tok = newFlow();
  setInput(null);
  clearLog(); addLog('me', S.q);
  const it = detectQ(S.q);
  Object.assign(S, { topic:it.topic, picks:[], extra:null, follow:0, ai:null, aiExtra:'', chat:[] });
  setPhase('focus'); renderFocus(); window.scrollTo(0,0); setExpr('thinking');
  const snip = S.q.length > 30 ? S.q.slice(0,30) + '…' : S.q;
  await say(CAT.ack(snip), 'neutral'); live(tok);
  await Promise.all([say(CAT.focus, 'neutral'), sleep(2200)]); live(tok);

  setPhase('pick'); S.deck = shuffle(DECK);
  renderPickGrid(S.deck, 3, '마음이 끌리는 카드 3장을 골라 주세요', '고른 순서대로 과거 · 현재 · 미래');
  say(CAT.pick, 'smile');
  S.picks = await waitPicks(3); live(tok);
  const aiReq = AI.on() ? AI.reading() : null;   // 카드를 뒤집는 동안 미리 요청
  if (aiReq) aiReq.catch(() => {});
  await sleep(700); live(tok);

  setPhase('reading'); renderReading(); window.scrollTo(0,0);
  await say(CAT.reveal, 'neutral'); live(tok);
  if (aiReq){
    try { S.ai = await withThinking(aiReq, CAT.thinking, tok); }
    catch (e){ if (e instanceof Abort) throw e; S.ai = null; toast(`AI 해석을 못 받았어요: ${e.message}. 기본 해석으로 진행해요.`, 4200); }
  }
  for (let i=0;i<3;i++){
    const slot = $('#slot'+i), card = S.picks[i];
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
    slot.classList.add('active');
    slot.querySelector('.tcard').classList.add('flipped');
    setExpr('surprised');
    await sleep(750); live(tok);
    slot.querySelector('.cap').textContent = card.key;
    const aiText = S.ai ? S.ai[['past','present','future'][i]] : '';
    await say(cardLine(card, POS[i], aiText), ENERGY_EXPR[card.e]); live(tok);
    await waitNext(); live(tok);
  }
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('active'));
  const sum = summaryLines();
  await say(sum.a, LV_EXPR[sum.lv]); live(tok);
  await waitNext(); live(tok);
  await say(sum.b, sum.lv==='low' ? 'smile' : 'bigsmile'); live(tok);
  await waitNext(); live(tok);
  showResult(tok, CAT.followPrompt);
}
function showResult(tok, line){
  setPhase('result'); renderResult(); window.scrollTo(0,0);
  updateFollowInput();
  return run(async()=>{ await say(line, 'smile'); live(tok); });
}
function updateFollowInput(){
  const left = MAX_FOLLOW - S.follow;
  if (left > 0) setInput(handleFollow, `추가 질문 (${left}번 남음)`);
  else setInput(null);
}
function handleFollow(text){
  addLog('me', text);
  if (/고마워|고맙|감사|땡큐|thank/i.test(text) && text.length < 20){
    run(async()=>{ const tok=newFlow(); await say(CAT.thanks,'bigsmile'); live(tok); });
    return;
  }
  if (/한\s*장\s*더|카드.*더\s*뽑|더\s*뽑/.test(text) && !S.extra){ run(flowExtra); return; }
  if (S.follow >= MAX_FOLLOW) return;
  S.follow++;
  updateFollowInput();
  run(async () => {
    const tok = newFlow();
    let ans = null;
    if (AI.on()){
      try {
        const txt = await withThinking(AI.follow(text), CAT.thinkingFollow, tok);
        ans = { text:txt, expr:'smile' };
        S.chat.push({ role:'user', content:text }, { role:'assistant', content:txt });
      } catch (e){ if (e instanceof Abort) throw e; toast(`AI 답변을 못 받았어요: ${e.message}`, 3600); }
    }
    if (!ans) ans = followAnswer(text);
    await say(ans.text, ans.expr); live(tok);
    const left = MAX_FOLLOW - S.follow;
    if (left > 0) await say(CAT.followLeft(left), 'smile', {log:false});
    else await say(CAT.followEnd, 'bigsmile');
    live(tok);
  });
}
async function flowExtra(){
  const tok = newFlow();
  setInput(null);
  setPhase('extra');
  const used = new Set(S.picks.map(c=>c.id));
  const pool = shuffle(DECK.filter(c=>!used.has(c.id)));
  renderPickGrid(pool, 1, '더 깊은 메시지를 위한 카드 1장', '가장 끌리는 카드를 골라 주세요');
  window.scrollTo(0,0);
  say(CAT.extraPick, 'smile');
  const [card] = await waitPicks(1); live(tok);
  const aiReq = AI.on() ? AI.extra(card) : null;
  if (aiReq) aiReq.catch(() => {});
  await sleep(500); live(tok);
  $('#panel').innerHTML = `<div class="spread" style="grid-template-columns:1fr;max-width:150px;margin:6px auto 0">
    <div class="slot active" id="slotX"><div class="pos">심층</div>${cardHTML(card)}<div class="cap"></div></div></div>`;
  await sleep(150); live(tok);
  $('#slotX .tcard').classList.add('flipped'); setExpr('surprised');
  await sleep(750); live(tok);
  $('#slotX .cap').textContent = card.key;
  S.extra = card; S.aiExtra = '';
  if (aiReq){
    try { S.aiExtra = await withThinking(aiReq, CAT.thinking, tok); }
    catch (e){ if (e instanceof Abort) throw e; toast(`AI 해석을 못 받았어요: ${e.message}`, 3600); }
  }
  await say(cardLine(card, '심층', S.aiExtra), ENERGY_EXPR[card.e]); live(tok);
  await waitNext(); live(tok);
  showResult(tok, CAT.afterExtra);
}

/* ═════════════ AI 연결 상태 ═════════════ */
function renderAiState(){
  const on = AI.on();
  $('#aiDot').classList.toggle('on', on);
  $('#aiBadge').title = on ? 'AI 해석 연결됨' : '기본 해석으로 진행 중';
  $('#aiState').innerHTML = on
    ? `<b>AI 해석 켜짐</b> · ${AI.ttsOn() ? 'AI 목소리' : '기본 목소리'}`
    : `지금은 <b>기본 해석</b>으로 진행돼요.`;
}

/* ═════════════ 시작 ═════════════ */
function renderVoiceBtn(){
  const b = $('#voiceBtn');
  b.setAttribute('aria-pressed', Voice.on ? 'true' : 'false');
  b.textContent = Voice.on ? '🔊' : '🔇';
  b.title = Voice.on ? '목소리 끄기 (자막만)' : '목소리 켜기';
}
function initStars(){
  const box = $('#stars'); let h='';
  for (let i=0;i<46;i++) h += `<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${(Math.random()*3).toFixed(2)}s;${Math.random()<.2?'width:3px;height:3px;':''}"></i>`;
  box.innerHTML = h;
}

Voice.init();
initStars();
$('#heroCat').innerHTML = catArt('neutral');
$('#heroName').textContent = CAT.name;
setExpr('smile');
renderVoiceBtn();
renderAiState();
AI.init();
$('#startBtn').onclick = enterRoom;
$('#voiceBtn').onclick = () => {
  if (!Voice.supported){ toast('이 브라우저는 음성 재생을 지원하지 않아 자막으로 진행해요.'); return; }
  Voice.on = !Voice.on; store('nbt_voice', Voice.on ? '1' : '0');
  if (!Voice.on) Voice.stop(); else Voice.unlock();
  renderVoiceBtn();
  toast(Voice.on ? '목소리를 켰어요' : '자막으로만 진행해요');
};
$('#homeBtn').onclick = goHome;
$('#dialog').onclick = onDialogTap;
$('#dialog').onkeydown = e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); onDialogTap(); } };
$('#nextBtn').onclick = () => { if (waitResolve) waitResolve(); };
$('#mic').onclick = toggleListen;
$('#send').onclick = submitInput;
$('#text').addEventListener('keydown', e => { if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); submitInput(); } });
if (!SR) $('#mic').title = '이 브라우저는 음성 입력이 안 돼요';
</script>
</body>
